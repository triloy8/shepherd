services:
  shepherd:
    image: shepherd:local
    build:
      context: .
      args:
        BUN_VERSION: "1.3.9"
        CODEX_VERSION: "0.160.1"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOME: /home/bun
      CODEX_HOME: /home/bun/.agents
      CLAUDE_CONFIG_DIR: /home/bun/.claude
      SHEPHERD_SKILLS_DIR: /home/bun/.agents/skills
    volumes:
      - ./envs:/app/envs:ro
      - codex-home:/home/bun/.agents
      - github-config:/home/bun/.config/gh
      - agent-workspaces:/home/bun/.agent-workspaces
      # Claude login and session transcripts, and Shepherd's thread-provider bindings and
      # swarm records, so recreating the container keeps Claude conversations resumable.
      - claude-home:/home/bun/.claude
      - shepherd-state:/home/bun/.shepherd
      - type: bind
        source: ${SHEPHERD_SKILLS_DIR:-${HOME}/.agents/skills}
        target: /home/bun/.agents/skills
        read_only: true

volumes:
  codex-home:
  github-config:
  agent-workspaces:
  claude-home:
  shepherd-state:
